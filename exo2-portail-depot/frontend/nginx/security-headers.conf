# En-tetes de securite, factorises parce qu'un `add_header` declare dans un bloc
# annule ceux herites du bloc parent : chaque `location` qui en pose un doit donc
# reinclure ce fichier, sinon la page perd silencieusement sa CSP.
#
# L'application ne charge aucune ressource tierce et auto-heberge ses polices,
# la politique peut rester stricte. `unsafe-inline` sur les styles est requis par
# Emotion, le moteur de style de Chakra, qui injecte ses regles a l'execution.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
