# Stack de production, pour le serveur partage.
#
# AUCUN `build:` ici, volontairement : les images sont construites par la CI et
# publiees sur GHCR, le serveur ne fait que les tirer. C'est ce que demande
# l'enonce — aucun code source sur la machine, seulement de la configuration.
#
# REGLE ABSOLUE SUR LES PORTS : tout `ports:` est prefixe de `127.0.0.1:`.
# Sans ce prefixe, Docker lie 0.0.0.0 ET ecrit ses propres regles iptables qui
# court-circuitent ufw : le service serait joignable depuis tout Internet, sur
# une machine partagee avec d'autres candidats.

name: div-portail

services:
  # --- Bord : termine TLS, seul point d'entree applicatif ----------------------
  edge:
    image: nginx:1.29-alpine
    restart: unless-stopped
    depends_on:
      - frontend
      - backend
    environment:
      PUBLIC_DOMAIN: ${PUBLIC_DOMAIN:?PUBLIC_DOMAIN manquant dans .env.prod}
      BACKEND_HOST: backend:3000
      FRONTEND_HOST: frontend:80
      NGINX_RESOLVER: 127.0.0.11
      # Vide tant que le certificat de production n'est pas obtenu. Voir
      # edge/security-headers.conf : HSTS avant le vrai certificat rendrait le
      # domaine inaccessible pour toute la duree du max-age.
      HSTS_VALUE: ${HSTS_VALUE:-}
      # Sans ce filtre, envsubst remplacerait aussi les variables nginx natives
      # ($uri, $host, $request_uri...) par du vide.
      NGINX_ENVSUBST_FILTER: '^(PUBLIC_DOMAIN|BACKEND_HOST|FRONTEND_HOST|NGINX_RESOLVER|HSTS_VALUE)$$'
    volumes:
      - ./edge/default.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ./edge/security-headers.conf:/etc/nginx/snippets/security-headers.conf:ro
      - letsencrypt:/etc/letsencrypt:ro
      - certbot-webroot:/var/www/certbot:ro
    ports:
      # 21000 : le proxy frontal y relaie le port 80 de la machine, par en-tete Host.
      - '127.0.0.1:21000:80'
      # 21001 : le proxy frontal y relaie le 443 en passthrough TLS par SNI.
      #         C'est nginx ici qui dechiffre, avec notre certificat.
      - '127.0.0.1:21001:443'
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1/healthz > /dev/null || exit 1']
      interval: 30s
      timeout: 5s
      retries: 3
    # Recharge periodique : un certificat renouvele n'est pris en compte qu'apres
    # un reload. Sans cela, le renouvellement reussit mais nginx continue de
    # servir l'ancien jusqu'a son expiration.
    command: >
      sh -c "while :; do sleep 6h & wait $${!}; nginx -s reload; done &
             exec /docker-entrypoint.sh nginx -g 'daemon off;'"

  certbot:
    image: certbot/certbot:v5.7.0
    restart: unless-stopped
    environment:
      # Lu par edge/bootstrap-cert.sh, execute dans ce conteneur via
      # `make cert-bootstrap` : l'image embarque deja openssl.
      PUBLIC_DOMAIN: ${PUBLIC_DOMAIN:?}
    volumes:
      - letsencrypt:/etc/letsencrypt
      - certbot-webroot:/var/www/certbot
    # Boucle de renouvellement. L'emission INITIALE ne passe pas par ici : elle
    # se fait explicitement via `make cert-staging` puis `make cert-prod`, pour
    # ne jamais consommer le quota Let's Encrypt — partage avec les autres
    # candidats sur rayan-drissi.com — sans intention deliberee.
    entrypoint: >
      sh -c "trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h & wait $${!}; done"

  # --- Application -------------------------------------------------------------
  backend:
    image: ghcr.io/${GHCR_OWNER:?GHCR_OWNER manquant}/div-portail-backend:${IMAGE_TAG:-latest}
    pull_policy: always
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://portail:${POSTGRES_PASSWORD:?}@postgres:5432/portail?schema=public
      JWT_SECRET: ${JWT_SECRET:?}
      DEPOSIT_JWT_SECRET: ${DEPOSIT_JWT_SECRET:?}
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:?}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?}
      S3_BUCKET: portail-depot
      S3_FORCE_PATH_STYLE: 'true'
      # Le seed est idempotent : il ne recree rien s'il trouve deja un compte.
      RUN_SEED: ${RUN_SEED:-true}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # Permet a l'API de publier les jours restants avant expiration du
      # certificat. Absent ailleurs qu'en production : la jauge n'est alors pas
      # exposee du tout, plutot que de valoir zero et d'alerter en continu.
      TLS_CERT_PATH: /etc/letsencrypt/live/${PUBLIC_DOMAIN}/fullchain.pem
    volumes:
      # Lecture seule. Le volume entier est monte (Docker ne sait pas monter un
      # seul fichier depuis un named volume) : privkey.pem est donc present dans
      # le conteneur, mais le code ne lit jamais que fullchain.pem (TLS_CERT_PATH
      # ci-dessus). Risque juge acceptable : montage en lecture seule, reseau
      # interne uniquement, backend deja de confiance (il detient les secrets
      # applicatifs).
      - letsencrypt:/etc/letsencrypt:ro
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:3000/health > /dev/null || exit 1']
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s

  frontend:
    image: ghcr.io/${GHCR_OWNER:?}/div-portail-frontend:${IMAGE_TAG:-latest}
    pull_policy: always
    restart: unless-stopped
    environment:
      BACKEND_HOST: backend:3000
    # Aucun port publie : seul `edge` lui parle, sur le reseau Docker interne.

  # --- Donnees -----------------------------------------------------------------
  postgres:
    image: postgres:17.7-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: portail
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: portail
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U portail -d portail']
      interval: 10s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?}
    volumes:
      - minio-data:/data
    healthcheck:
      test: ['CMD-SHELL', 'mc ready local || exit 1']
      interval: 10s
      timeout: 3s
      retries: 30

  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?}
    entrypoint: /bin/sh
    command:
      - -c
      - |
        set -e
        mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"
        mc mb --ignore-existing local/portail-depot
        mc anonymous set none local/portail-depot
        mc version enable local/portail-depot

  # --- Observabilite -----------------------------------------------------------
  prometheus:
    image: prom/prometheus:v3.13.2
    restart: unless-stopped
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.retention.time=15d'
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      # Loopback seul : joignable uniquement par tunnel SSH depuis la machine.
      - '127.0.0.1:21003:9090'

  grafana:
    image: grafana/grafana:13.1.3
    restart: unless-stopped
    depends_on:
      - prometheus
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?}
      GF_USERS_ALLOW_SIGN_UP: 'false'
      GF_ANALYTICS_REPORTING_ENABLED: 'false'
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      # Le provider de dashboards lit ce chemin : sans ce montage, Grafana
      # journalise une erreur au demarrage et ne charge rien.
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      # ssh -N -L 3000:127.0.0.1:21002 <user>@<serveur>
      - '127.0.0.1:21002:3000'

volumes:
  postgres-data:
  minio-data:
  prometheus-data:
  grafana-data:
  letsencrypt:
  certbot-webroot:
