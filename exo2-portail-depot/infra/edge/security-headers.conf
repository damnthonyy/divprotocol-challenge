# En-tetes de securite, factorises parce qu'un `add_header` declare dans un bloc
# annule TOUS ceux herites du bloc parent : chaque `location` qui en pose un doit
# donc reinclure ce fichier, sinon la page perd silencieusement sa politique.
#
# L'application ne charge aucune ressource tierce et auto-heberge ses polices, la
# politique peut donc rester stricte. `unsafe-inline` sur les styles est impose par
# Emotion, le moteur de style de Chakra, qui injecte ses regles a l'execution.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

# HSTS n'est pose que si ENABLE_HSTS vaut 1, c'est-a-dire une fois le certificat de
# production obtenu. L'activer plus tot rendrait le domaine inaccessible pendant
# toute la duree du max-age en cas d'echec d'emission — et un navigateur qui a vu
# l'en-tete refuse ensuite de revenir en HTTP, meme pour reparer.
add_header Strict-Transport-Security $hsts_header always;
