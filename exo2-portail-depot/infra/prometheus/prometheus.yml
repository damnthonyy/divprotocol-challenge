# Configuration Prometheus.
#
# Les regles d'alerte ne vivent PAS ici mais dans
# grafana/provisioning/alerting/rules.yml : l'evaluation est faite par Grafana,
# ce qui evite un conteneur Alertmanager de plus a operer sur une machine
# partagee, et affiche l'alerte dans la meme interface que le graphe qui
# l'explique.
#
# Le raisonnement derriere le choix des metriques est dans le README, section
# Observabilite, et dans backend/src/observability/metrics.ts.

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    service: portail-depot

scrape_configs:
  # L'API expose /metrics via @willsoto/nestjs-prometheus : metriques metier du
  # portail (depots, PIN, connexions, coherence base/stockage) et metriques par
  # defaut du process Node.
  - job_name: backend
    metrics_path: /metrics
    static_configs:
      - targets: ['backend:3000']
        labels:
          component: api

  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

  # MinIO expose des metriques Prometheus sans authentification sur ce chemin
  # lorsque MINIO_PROMETHEUS_AUTH_TYPE vaut "public". Laisse commente tant que ce
  # n'est pas active : un target rouge en permanence rend le tableau de bord
  # inutilisable et masque les vraies pannes.
  # - job_name: minio
  #   metrics_path: /minio/v2/metrics/cluster
  #   static_configs:
  #     - targets: ['minio:9000']
