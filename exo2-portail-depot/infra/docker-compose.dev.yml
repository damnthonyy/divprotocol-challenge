# Stack de developpement : les dependances du backend, rien d'autre.
# Le backend et le frontend tournent en local (npm run start:dev / npm run dev)
# pour garder le rechargement a chaud. La stack complete vit dans docker-compose.prod.yml.
#
# Les ports sont publies sur 127.0.0.1 uniquement, meme en developpement : c'est la
# contrainte du serveur partage, autant prendre l'habitude tout de suite.

name: div-portail-dev

services:
  postgres:
    image: postgres:17.7-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: portail
      POSTGRES_PASSWORD: portail
      POSTGRES_DB: portail
    ports:
      # Port decale : 5432 est souvent deja pris par un autre projet sur la machine.
      - '127.0.0.1:55432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U portail -d portail']
      interval: 5s
      timeout: 3s
      retries: 10

  # Tag epingle explicitement. MinIO Community Edition est archive depuis avril 2026 :
  # RELEASE.2025-09-07 est la derniere image publiee. On ne suivra pas `latest`, il n'y
  # aura plus de `latest`. Le code cible l'API S3, pas MinIO : voir backend/src/storage/.
  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - '127.0.0.1:59000:9000' # API S3
      - '127.0.0.1:59001:9001' # console (bridee en Community Edition)
    volumes:
      - minio-data:/data
    healthcheck:
      test: ['CMD-SHELL', 'mc ready local || exit 1']
      interval: 5s
      timeout: 3s
      retries: 20

  # La console admin ayant ete retiree de la Community Edition, le provisioning passe
  # par `mc`. C'est de toute facon ce qu'il faut pour un install.sh sans intervention.
  # Le conteneur s'execute une fois puis sort : toutes les commandes sont idempotentes.
  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
      S3_BUCKET: ${S3_BUCKET:-portail-depot}
    entrypoint: /bin/sh
    command:
      - -c
      - |
        set -e
        mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"
        mc mb --ignore-existing "local/$$S3_BUCKET"
        # Les pieces ne sont jamais publiques : elles sortent par URL pre-signee ou par l'API.
        mc anonymous set none "local/$$S3_BUCKET"
        # Versioning : un depot ne doit jamais ecraser silencieusement une piece homonyme.
        mc version enable "local/$$S3_BUCKET"
        echo "Bucket $$S3_BUCKET pret."

volumes:
  postgres-data:
  minio-data:
